# Guards the deployment-path invariant: every path-specific instruction lives
# inside a pathtabs block, and the generated handouts match their source pages.
#
# Separate from static.yml on purpose — that file is in the repo template's
# FILES_TO_COPY, so anything added there is reverted by the next template upgrade.
name: Path lint

# GitHub Actions does not expand YAML anchors, so the two path lists are
# duplicated by necessity — keep them in sync.
on:
  pull_request:
    paths:
      - "content/**"
      - "layouts/shortcodes/pathtab*.html"
      - "scripts/gen_handouts.py"
      - "scripts/lint_paths.py"
      # gen_handouts.py derives PATHS from deploymentPaths here, and lint_paths.py
      # imports PATHS from it -- so editing this file changes what the linter
      # enforces and must trigger it.
      - "scripts/repoConfig.json"
      - ".github/workflows/path-lint.yml"
  # Direct pushes to main skip the pull_request trigger entirely — d512c5c did
  # exactly that, hand-edited the handouts, and left handout-k8s stale.
  push:
    branches: [main]
    paths:
      - "content/**"
      - "layouts/shortcodes/pathtab*.html"
      - "scripts/gen_handouts.py"
      - "scripts/lint_paths.py"
      # gen_handouts.py derives PATHS from deploymentPaths here, and lint_paths.py
      # imports PATHS from it -- so editing this file changes what the linter
      # enforces and must trigger it.
      - "scripts/repoConfig.json"
      - ".github/workflows/path-lint.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || '' }}
          persist-credentials: false

      # Auto-fix, PRs only: a direct push to main is already too late to fix before
      # merge, and there is no PR head ref to push back to.
      - name: Regenerate handouts
        if: github.event_name == 'pull_request'
        id: regen
        run: |
          python3 scripts/gen_handouts.py
          if [ -n "$(git status --porcelain -- content/09Reference/handouts)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN pushes deliberately do not retrigger workflow runs (GitHub's own
      # recursion guard), so the just-fixed commit would never get its own green
      # lint/handouts run -- hence HANDOUT_AUTOFIX_PAT, a fine-grained PAT scoped to
      # contents:write on this repo only. If the secret is absent (e.g. this workflow
      # file copied into a repo that hasn't provisioned one yet), no-op cleanly and
      # revert the working tree so lint_paths.py below reports the real "stale, run
      # gen_handouts.py locally" failure instead of a spurious pass.
      - name: Push regenerated handouts
        if: github.event_name == 'pull_request' && steps.regen.outputs.changed == 'true'
        env:
          HANDOUT_AUTOFIX_PAT: ${{ secrets.HANDOUT_AUTOFIX_PAT }}
        run: |
          if [ -z "$HANDOUT_AUTOFIX_PAT" ]; then
            echo "HANDOUT_AUTOFIX_PAT is not set -- leaving handouts as committed so the freshness check below fails with a clear message. Run 'python3 scripts/gen_handouts.py' locally and commit the result." >&2
            git checkout -- content/09Reference/handouts
            git clean -fd content/09Reference/handouts
            exit 0
          fi
          git config user.name "ai-101-handout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/09Reference/handouts
          git commit -m "chore: auto-regenerate stale handouts [handout-autofix]"
          git push "https://x-access-token:${HANDOUT_AUTOFIX_PAT}@github.com/${{ github.repository }}.git" "HEAD:${{ github.head_ref }}"

      - name: Lint deployment paths
        run: python3 scripts/lint_paths.py
